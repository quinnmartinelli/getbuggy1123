<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML5 Validation Regression Fixture</title>
  <meta name="description" content="Fixture for HTML5 constraint-aware form filling.">
  <link rel="icon" href="favicon.ico">
  <style>
    body { font-size: 16px; font-family: sans-serif; }
    input, textarea, button { font-size: 16px; padding: 10px 14px; }
  </style>
</head>
<body>
  <h1>HTML5 Validation Regression Fixture</h1>

  <!-- Case: a required phone field with a dashed-format pattern. The old
       generic "5555555555" fill fails this pattern, silently blocking
       the submit event and producing a false HIGH "Broken Form" on a
       form that works fine for a real visitor who enters a valid phone
       number. The fix should generate a phone value that actually
       matches the pattern, so this form is correctly reported as fine. -->
  <form id="phone-form">
    <label>Name <input name="name" required></label>
    <label>Phone <input name="phone" type="tel" required pattern="\d{3}-\d{3}-\d{4}"></label>
    <button type="submit">Submit</button>
  </form>

  <!-- Case: a required field with a pattern no reasonable generic guess
       can satisfy (an exact-format coupon code). The fix can't fill this
       either, but it must say so — "needs a look," naming the field —
       rather than clicking submit anyway and reporting a false "broken." -->
  <form id="coupon-form">
    <label>Coupon code <input name="coupon" required pattern="^[A-Z]{2}-[0-9]{4}-[a-z]{3}$"></label>
    <button type="submit">Submit</button>
  </form>

  <script>
    document.getElementById('phone-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.body.insertAdjacentHTML('beforeend', '<p>Thank you — message received!</p>');
    });
    document.getElementById('coupon-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.body.insertAdjacentHTML('beforeend', '<p>Thank you — coupon applied!</p>');
    });
  </script>
</body>
</html>
