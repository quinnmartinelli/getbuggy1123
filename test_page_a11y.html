<!DOCTYPE html>
<!-- Step 6 accessibility fixture. Every planted violation is labelled; the
     regression harness expects exactly one finding per category below.
     Planted: missing lang on <html>; low-contrast text; a field with no
     label; an icon-only button with no name; an empty link; a heading that
     skips from H1 to H4; duplicate IDs; a link whose focus outline is
     removed; audio that autoplays with sound; a video with controls and no
     captions; an overlay widget script reference (non-executing type, so
     the fixture never fetches the real vendor). Deliberately NOT planted
     (must stay silent): a muted autoplay background loop with no controls,
     and a properly-labelled field / named button / visible-focus link. -->
<html>
<head>
  <meta charset="UTF-8">
  <title>Accessibility Fixture</title>
  <meta name="description" content="Fixture page with planted accessibility violations.">
  <link rel="icon" href="sample_image.png">
  <style>
    body { font-family: sans-serif; background: #ffffff; color: #111111; }
    .faint { color: #cccccc; }
    a.no-focus:focus, a.no-focus:focus-visible { outline: none; }
    a.good-focus:focus-visible { outline: 3px solid #0050b3; }
  </style>
  <!-- Planted: overlay widget reference -->
  <script type="application/x-getbuggy-fixture" src="https://cdn.userway.org/widget.js"></script>
</head>
<body>
  <main>
    <h1>Accessibility fixture</h1>

    <!-- Planted: low contrast -->
    <p class="faint">This text is very light grey on white.</p>

    <!-- Planted: heading skips H2 and H3 -->
    <h4>Opening hours</h4>
    <p>Mon–Fri 9–5.</p>

    <div class="signup">
      <!-- Planted: field with no label -->
      <input type="text" name="nickname">
      <!-- Not planted: properly labelled field -->
      <label for="email">Email</label>
      <input type="email" id="email" name="email">
      <!-- Planted: icon-only button with no name -->
      <button type="button"><svg width="10" height="10" aria-hidden="true"><rect width="10" height="10"></rect></svg></button>
      <!-- Not planted: named button -->
      <button type="button">Send</button>
    </div>

    <!-- Planted: empty link -->
    <a href="#hours"></a>

    <!-- Planted: duplicate IDs -->
    <div id="hours">First</div>
    <div id="hours">Second</div>

    <!-- Planted: focus outline removed with no replacement -->
    <a class="no-focus" href="#top">Back to top</a>
    <!-- Not planted: clear focus style -->
    <a class="good-focus" href="#top">Top (visible focus)</a>

    <!-- Planted: autoplay with sound -->
    <audio autoplay></audio>

    <!-- Planted: video meant to be watched, no captions -->
    <video controls width="160" height="90"></video>

    <!-- Not planted: silent decorative background loop -->
    <video autoplay muted loop playsinline width="160" height="90"></video>
  </main>
</body>
</html>
